[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-workspace"
version = "0.1.0"
description = "Linux/WSL Codex terminal workspace with a Trivia and Projects sidebar"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
codex-workspace = "codex_workspace.workspace:cli"

[tool.setuptools]
packages = ["codex_workspace"]
package-dir = {codex_workspace = "."}
include-package-data = false

[tool.setuptools.package-data]
codex_workspace = ["policies/*.md"]
