[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbor"
version = "0.2.0"
description = "Linux/WSL AI workspace with projects and local or remote model connections"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
harbor = "harbor.workspace:cli"
codex-workspace = "harbor.workspace:cli"

[tool.setuptools]
packages = ["harbor"]
package-dir = {harbor = "."}
include-package-data = false

[tool.setuptools.package-data]
harbor = ["policies/*.md"]
